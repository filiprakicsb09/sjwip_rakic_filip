<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .red {
      height: 350px;
      width: 500px;
      background-color: rgb(214, 9, 9);
      position: relative;
    }
    .bijeli {
      height: 200px;
      width: 200px;
      background-color: aliceblue;
      border-radius: 50%;
      top: 75px;
      left: 80px;
      position: absolute;
    }
    .crvkr {
      height: 170px;
      width: 170px;
      background-color: rgb(214, 9, 9);
      border-radius: 50%;
      top: 90px;
      left: 120px;
      position: absolute;
    }
    .zvi {
      position: absolute;
      top: 120px;
      left: 250px;
      width: 100px;
      height: 100px;
      background-color: white;
      clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
      );
      transform: rotate(-20deg);
    }
  </style>
  <body>
    <div class="red">
      <div class="bijeli"></div>
      <div class="crvkr"></div>
      <div class="zvi"></div>
    </div>
  </body>
</html>
