<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .plavi {
        position: relative;
        height: 350px;
        width: 500px;
        background-color: rgb(24, 24, 139);
      }
      .bijeli1 {
        height: 80px;
        width: 500px;
        top: 135px;
        position: absolute;
        background-color: whitesmoke;
      }
      .bijeli2 {
        height: 350px;
        width: 80px;
        left: 100px;
        position: absolute;
        background-color: whitesmoke;
      }
      .crveni1 {
        height: 40px;
        width: 500px;
        top: 155px;
        position: absolute;
        background-color: rgb(190, 24, 24);
      }
      .crveni2 {
        height: 350px;
        width: 40px;
        left: 120px;
        position: absolute;
        background-color: rgb(190, 24, 24);
      }
    </style>
  </head>
  <body>
    <div class="plavi">
      <div class="bijeli1"></div>
      <div class="bijeli2"></div>
      <div class="crveni1"></div>
      <div class="crveni2"></div>
    </div>
  </body>
</html>
