<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .zeleni {
        position: relative;
        width: 500px;
        height: 350px;
        background-color: green;
        top: 100px;
        left: 100px;
      }
      .zuti {
        position: absolute;
        height: 175px;
        width: 300px;
        left: 200px;
        background-color: rgb(223, 184, 14);
      }
      .crveni {
        position: absolute;
        height: 175px;
        width: 300px;
        left: 200px;
        top: 175px;
        background-color: rgb(190, 13, 13);
      }
    </style>
  </head>
  <body>
    <div class="zeleni">
      <div class="zuti"></div>
      <div class="crveni"></div>
    </div>
  </body>
</html>
