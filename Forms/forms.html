<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>Forme u html-u</h1>
    <form action="#" method="get">
      <label for="ime">Unesi ime:</label>
      <input type="text" id="ime" placeholder="Unesi ime..." disabled /><br />
      <label for="prezime">Prezime:</label>
      <input type="text" id="prezime" size="5" maxlength="10" /><br />
      <label for="pass">Unesi lozinku:</label>
      <input type="password" name="pass" id="pass" required /><br />
      <label for="mail">Unesi e-mail:</label>
      <input type="email" id="mail" name="mail" /><br />
      <label for="date">Izaberi datum:</label>
      <input type="date" name="date" id="date" /><br />
      <label for="color">Izaberite boju:</label><br />
      <input type="color" name="color" id="color" /><br />
      <label for="file">Prilozi datoteku:</label>
      <input type="file" name="file" id="file" /><br />
      <label for="tel">Unesi broj mobitela:</label>
      <input type="tel" name="tel" id="tel" /><br />
      <p>Odaberi najbolji klub:</p>
      <input type="radio" name="klub" id="real" value="Real Madrid" />
      <label for="real">Real Madrid</label>
      <input type="radio" name="klub" id="barca" />
      <label for="barca">Barcelona</label><br />
      <p>Odaberi najbolji klub:</p>
      <input type="checkbox" name="klub1" id="real" value="Real Madrid" />
      <label for="real">Real Madrid</label><br />
      <input type="checkbox" name="klub2" id="barca" />
      <label for="barca">Barcelona</label><br />

      <input type="reset" value="obrisi" />
      <input type="submit" value="Pošalji" /><br />
    </form>
  </body>
</html>
