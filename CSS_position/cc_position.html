<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    div {
      width: 400px;
      height: 400px;
    }
    .relative {
      background-color: brown;
      position: relative;
    }
    .absolute {
      background-color: aquamarine;
      position: absolute;
      top: 50px;
      left: 50px;
      z-index: -1;
    }
  </style>
  <body>
    <div class="relative">
      <div class="absolute"></div>
    </div>
  </body>
</html>
